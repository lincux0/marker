name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: src/Marker.Web/package-lock.json
      - name: Pin npm
        run: npm install --global npm@12.0.0
      - name: Check and build unsigned MSIX
        shell: pwsh
        run: ./scripts/build.ps1 -Package
      - uses: actions/upload-artifact@v4
        with:
          name: marker-x64-unsigned
          path: artifacts/msix/**
          if-no-files-found: error
