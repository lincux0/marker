name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: src/Marker.Web/package-lock.json
      - name: Pin npm
        run: npm install --global npm@12.0.0
      - name: Check and build unsigned MSIX
        shell: pwsh
        run: ./scripts/build.ps1 -Package
      - name: Build unsigned Setup from the verified Release output
        shell: pwsh
        run: ./scripts/build-setup.ps1 -SkipBuild
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: marker-setup-x64-unsigned
          path: artifacts/setup/**
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: marker-msix-x64-unsigned
          path: artifacts/msix/**/*.msix
          if-no-files-found: error
